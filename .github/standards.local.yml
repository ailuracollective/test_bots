---
extends: "ailuracollective/standards@6df6771969b7375a2afe12de9fcdfc4c096df38"

input-overrides:
  - input: "enable-status-comment"
    value: "false"
    reason: "No repository-specific comment token and verified comment identity are configured."

extensions:
  - name: "ai/queued"
    color: "CFD3D7"
    description: "Accepted work awaiting execution, including scheduled retries."
  - name: "ai/processing"
    color: "1D76DB"
    description: "Active execution."
  - name: "ai/waiting"
    color: "FBCA04"
    description: "Waiting for an external condition without human intervention."
  - name: "ai/blocked"
    color: "B60205"
    description: "An unmet prerequisite prevents progress."
  - name: "ai/needs-input"
    color: "D93F0B"
    description: "Human information or a decision is required."
  - name: "ai/failed"
    color: "B60205"
    description: "Unsuccessful terminal outcome with no automatic retry pending."
  - name: "ai/cancelled"
    color: "6E7781"
    description: "Confirmed cancellation."
  - name: "ai/completed"
    color: "0E8A16"
    description: "Successful automated work, independent of merge or issue closure."
